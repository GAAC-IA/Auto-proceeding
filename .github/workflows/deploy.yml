name: Deploy Web

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/Auto-proceeding

            git pull origin main

            cat > .env.production << 'EOF'
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            NOTION_OAUTH_CLIENT_ID=${{ secrets.NOTION_OAUTH_CLIENT_ID }}
            NOTION_OAUTH_CLIENT_SECRET=${{ secrets.NOTION_OAUTH_CLIENT_SECRET }}
            APP_BASE_URL=${{ secrets.APP_BASE_URL || 'https://ia-ama.site' }}
            NOTION_OAUTH_REDIRECT_URI=${{ secrets.NOTION_OAUTH_REDIRECT_URI || 'https://ia-ama.site/api/notion/oauth/callback' }}
            N8N_WEBHOOK_URL=${{ secrets.N8N_WEBHOOK_URL }}
            N8N_WEBHOOK_SECRET=${{ secrets.N8N_WEBHOOK_SECRET }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            APP_BASE_URL=${{ secrets.APP_BASE_URL }}
            EOF

            npm install
            npm run build

            pm2 restart ama-web || pm2 start npm --name ama-web -- start
            pm2 save
